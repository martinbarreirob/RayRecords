@if (auth.user(); as user) {
  <header class="topbar">
    <div class="primary">
      <div class="topbar-inner">
        <!-- Left: the brand and the first level, the area (each tab returns to its last section). -->
        <div class="start">
          <a class="brand" routerLink="/" aria-label="RayRecords">
            <img class="logo" src="logo.svg" alt="" width="28" height="28" />
            <span class="brand-name">RayRecords</span>
          </a>
          <div class="areas" role="group" aria-label="Espacio">
            @for (area of areas; track area.id) {
              <a
                [routerLink]="areaTarget(area.id)"
                [class.active]="currentArea() === area.id"
                [attr.aria-current]="currentArea() === area.id ? 'true' : null"
                ><span class="tab-text" [attr.data-text]="area.label">{{ area.label }}</span></a
              >
            }
          </div>
        </div>

        <!-- Right: the user menu (theme and logout) and, to its right, the search. -->
        <div class="end">
          <div class="user-menu">
            <button
              type="button"
              class="btn ghost icon user-button"
              aria-haspopup="true"
              aria-controls="user-menu-list"
              [attr.aria-expanded]="menuOpen()"
              [attr.aria-label]="'Menú de ' + user.username"
              [title]="user.username"
              (click)="menuOpen.set(!menuOpen())"
            >
              <app-icon name="user" />
            </button>
            <div class="actions" id="user-menu-list" [class.open]="menuOpen()">
              <span class="who">{{ user.username }}</span>
              <button
                type="button"
                class="btn ghost theme-toggle"
                [attr.aria-label]="
                  'Cambiar a tema ' + (theme.resolved() === 'dark' ? 'claro' : 'oscuro')
                "
                [title]="'Tema ' + theme.label().toLowerCase()"
                (click)="toggleTheme()"
              >
                <app-icon [name]="theme.resolved() === 'dark' ? 'sun' : 'moon'" />
                <span class="label">{{
                  theme.resolved() === 'dark' ? 'Tema claro' : 'Tema oscuro'
                }}</span>
              </button>
              <button
                type="button"
                class="btn ghost logout"
                [attr.aria-label]="'Salir (' + user.username + ')'"
                (click)="logout()"
              >
                <app-icon name="logout" />
                <span class="label">Salir</span>
              </button>
            </div>
          </div>

          <button type="button" class="palette-trigger" (click)="palette.show()">
            <app-icon name="search" />
            <span class="palette-label">Buscar o ejecutar…</span>
            <span class="kbd">Ctrl K</span>
            <span class="sr-only">Abrir la paleta de comandos</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Second level: the sections of the current area. -->
    <div class="secondary">
      <nav class="secondary-inner" aria-label="Secciones">
        @for (section of sections(); track section.url) {
          <a [routerLink]="section.url" routerLinkActive="active"
            ><span class="tab-text" [attr.data-text]="section.label">{{ section.label }}</span></a
          >
        }
      </nav>
    </div>
  </header>

  <app-command-palette />
}

<!-- The only part that scrolls: the two header rows above stay put. -->
<main #content [id]="scrollerId">
  <router-outlet />
</main>
