# Optional override: joins the API to the Docker network where the other project's MongoDB already lives.
# Enabled with COMPOSE_FILE=docker-compose.yml:docker-compose.mongo-network.yml (see .env.example).
# MONGO_URI can then point at the service name, e.g. mongodb://rayrecords:…@mongodb:27017/rayrecords
services:
  api:
    networks:
      - default
      - mongo

networks:
  mongo:
    external: true
    name: ${MONGO_NETWORK:?Set MONGO_NETWORK in deploy/.env}
