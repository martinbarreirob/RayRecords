# Production (Hetzner CX23, 4 GB). Three small services: nginx with the static files, the API and
# a Cloudflare Tunnel connector. MongoDB is NOT here: the instance that already runs on the server
# is used, with its own database and a user limited to it.
# Images are built in CI; the server only runs `docker compose pull && up -d`.
#
# Memory budget of this stack: 64 + 256 + 64 = 384 MB (Mongo is accounted for separately).
name: rayrecords

services:
  web:
    image: ghcr.io/${GHCR_OWNER:-martinbarreirob}/rayrecords-web:${TAG:-latest}
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m # = mem_limit: no swap, so one failure cannot degrade the whole server
    cpus: 0.5
    depends_on:
      api:
        condition: service_healthy
    # Only listens on localhost. Public access goes through the cloudflared service below, which
    # reaches this container over the compose network, so no host port is exposed to the internet.
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:80'
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]

  api:
    image: ghcr.io/${GHCR_OWNER:-martinbarreirob}/rayrecords-api:${TAG:-latest}
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    environment:
      NODE_ENV: production
      PORT: '3000'
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in deploy/.env}
      MONGO_DB: ${MONGO_DB:-rayrecords}
      # V8 heap below the container limit so the GC acts before the OOM killer does.
      NODE_OPTIONS: --max-old-space-size=192
    # For a Mongo installed on the host: MONGO_URI=mongodb://…@host.docker.internal:27017/rayrecords
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # Cloudflare Tunnel connector (remotely managed: ingress rules live in Cloudflare, only the token is here).
  # It opens an outbound connection to Cloudflare, so no inbound port is needed.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in deploy/.env}
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
