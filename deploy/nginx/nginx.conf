# Behind the Cloudflare Tunnel every request comes from the cloudflared container. Trust
# CF-Connecting-IP only when it comes from the Docker network, so clients cannot spoof it.
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=api:2m rate=20r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's internal DNS: resolves `api` on every request, so nginx starts even if the API is not
  # up yet and keeps working when its container is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Small default; the API location raises it for CSV uploads.
  client_max_body_size 64k;
  client_body_timeout 15s;
  client_header_timeout 15s;

  # Security headers live at server level only: an add_header inside a location would drop these.
  # HSTS is set by Cloudflare (it terminates HTTPS), so it is not repeated here.
  # The script hashes are filled in at image build time (deploy/nginx/build-conf.mjs): hashing the
# inline scripts Angular adds to index.html avoids 'unsafe-inline' for scripts.
  # 'unsafe-inline' remains for styles, which Angular and PrimeNG inject at runtime.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' __SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    # With the port (`$http_host`): the API compares the browser's `Origin` with this host.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Cloudflare terminates HTTPS and sends X-Forwarded-Proto: the API needs it for Secure cookies.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;
    client_max_body_size 5m; # CSV statements
  }

  # Never serve hidden files.
  location ~ /\. {
    return 404;
  }

  # index.html is never cached (it references the hashed bundles); the bundles are cached a year.
  location = /index.html {
    expires -1;
  }

  # Not content-hashed, so they must not be cached for a year like the bundles. A cached service
  # worker or manifest would stop updates from reaching the phone.
  location ~ ^/(?:theme-init\.js|sw\.js|manifest\.webmanifest)$ {
    expires -1;
  }

  # The logo and the icons are not content-hashed either: a day is enough to pick up a new logo.
  location = /logo.svg {
    expires 1d;
  }

  location = /favicon.ico {
    expires 1d;
  }

  location ^~ /icons/ {
    expires 1d;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico)$ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA fallback: any Angular route returns index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
