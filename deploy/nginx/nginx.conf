server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: resuelve `api` en cada petición, así nginx arranca aunque la API no esté
  # todavía y sigue funcionando si se recrea su contenedor.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Las cabeceras de seguridad van solo a nivel de servidor: un add_header dentro de un location
  # anularía las de aquí. (La CSP queda pendiente hasta tener la UI definitiva.)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    # Con puerto (`$http_host`): la API compara el `Origin` del navegador con este host.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Cloudflare terminates HTTPS and sends X-Forwarded-Proto: the API needs it for Secure cookies.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 5m; # extractos CSV
  }

  # index.html nunca se cachea (referencia a los bundles con hash); los bundles, un año.
  location = /index.html {
    expires -1;
  }

  location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico)$ {
    expires 1y;
    try_files $uri =404;
  }

  # Fallback de SPA: cualquier ruta de Angular devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
